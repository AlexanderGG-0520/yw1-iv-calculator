apiVersion: apps/v1
kind: Deployment
metadata:
  name: yw1-iv-calculator
  labels:
    app.kubernetes.io/name: yw1-iv-calculator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: yw1-iv-calculator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yw1-iv-calculator
    spec:
      containers:
        - name: web
          image: ghcr.io/alexandergg-0520/yw1-iv-calculator:954b84ce80fcc0bdaa4da6a0fb91a0054facc880
          ports:
            - name: http
              containerPort: 80
          env:
            - name: PUBLIC_ORIGIN
              value: "https://yw1-iv.alec-ofc.com"
            - name: TRUSTED_PROXY_CIDRS
              value: "10.244.0.0/16"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: yw1-iv-calculator
  labels:
    app.kubernetes.io/name: yw1-iv-calculator
spec:
  selector:
    app.kubernetes.io/name: yw1-iv-calculator
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: yw1-iv-calculator-trusted-proxies
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: yw1-iv-calculator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflared
          podSelector:
            matchLabels:
              app: cloudflared
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - protocol: TCP
          port: 80
