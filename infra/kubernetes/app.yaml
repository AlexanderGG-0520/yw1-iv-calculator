apiVersion: apps/v1
kind: Deployment
metadata:
  name: yw1-iv-calculator
  labels:
    app.kubernetes.io/name: yw1-iv-calculator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: yw1-iv-calculator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yw1-iv-calculator
    spec:
      containers:
        - name: web
          image: ghcr.io/alexandergg-0520/yw1-iv-calculator:latest
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: yw1-iv-calculator
  labels:
    app.kubernetes.io/name: yw1-iv-calculator
spec:
  selector:
    app.kubernetes.io/name: yw1-iv-calculator
  ports:
    - name: http
      port: 80
      targetPort: http
